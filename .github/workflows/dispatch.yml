name: Dispatch checks

# Called by the generated entry workflow in each consumer. It reads this repository's registry,
# resolves the calling repository's check types, and runs one job per type that it lists.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve check types
    runs-on: ubuntu-latest
    outputs:
      types: ${{ steps.registry.outputs.types }}
    steps:
      - name: Read this repository's registry entry
        id: registry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # A promotion PR (`<mc>/development` -> `<mc>/main`) resolves to no types. Its tests already
          # ran on the version line, the release job owns the three facts that make it legitimate, and
          # `main` validates again on the post-merge push. Deciding it here rather than in the synced
          # entry workflow keeps that file identical in every consumer, and keeps GitHub's fork
          # approval gate from turning a run nobody needs into a red zero-job failure.
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == */main ]]; then
            echo "::notice::$BASE_REF is a promotion target; its tests ran on the version line"
            echo "types=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          content=$(gh api "repos/kirjorjos/ci/contents/consumers.jsonl" --jq .content \
            | tr -d '\n' | base64 -d)
          entry=$(jq -c --arg repo "$REPO" 'select(.repo == $repo)' <<<"$content")
          if [[ -z "$entry" ]]; then
            echo "::notice::$REPO is not registered in kirjorjos/ci; no shared checks run"
            echo "types=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          types=$(jq -c '.types // []' <<<"$entry")
          echo "types=$types" >> "$GITHUB_OUTPUT"
          echo "$REPO runs: $types"

  # One job per known type. `jobs.<id>.uses` cannot be built from a matrix, so this list is the one
  # place a new type is enumerated - see README, "Adding a type".
  screenshots:
    name: Screenshots
    needs: resolve
    if: contains(fromJSON(needs.resolve.outputs.types), 'screenshots')
    permissions:
      contents: read
      pull-requests: write
    uses: kirjorjos/ci/.github/workflows/type-screenshots.yml@minecraft-mods/v1

  lifecycle:
    name: Lifecycle
    needs: resolve
    if: contains(fromJSON(needs.resolve.outputs.types), 'lifecycle')
    permissions:
      contents: read
    uses: kirjorjos/ci/.github/workflows/type-lifecycle.yml@minecraft-mods/v1

  scripts:
    name: Scripts
    needs: resolve
    if: contains(fromJSON(needs.resolve.outputs.types), 'scripts')
    permissions:
      contents: read
      pull-requests: write
    uses: kirjorjos/ci/.github/workflows/type-scripts.yml@minecraft-mods/v1

  issues:
    name: Issues
    needs: resolve
    if: contains(fromJSON(needs.resolve.outputs.types), 'issues')
    permissions:
      contents: read
      issues: write
    uses: kirjorjos/ci/.github/workflows/type-issues.yml@minecraft-mods/v1

  # The one type that runs on `pull_request_target` rather than `pull_request`: it comments on and
  # closes pull requests, which a fork's read-only token cannot do. It never checks the PR out.
  rules:
    name: Rules
    needs: resolve
    if: contains(fromJSON(needs.resolve.outputs.types), 'rules')
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: kirjorjos/ci/.github/workflows/type-rules.yml@minecraft-mods/v1
