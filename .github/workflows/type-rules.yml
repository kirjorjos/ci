name: Rules

# Judged on `pull_request_target`, never on `pull_request`: the base repository's token is what lets
# a fork's pull request be commented on and closed, and gating to one of the two events keeps the
# rule from running (and commenting) twice for the same push.
on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  rules:
    name: Validate PR rules
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Judge the shape and act on it
        uses: kirjorjos/ci/minecraft-mods/types/rules/check@minecraft-mods/v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          event-action: ${{ github.event.action }}
          base-ref: ${{ github.event.pull_request.base.ref }}
          head-ref: ${{ github.event.pull_request.head.ref }}
          head-repo: ${{ github.event.pull_request.head.repo.full_name }}
          author: ${{ github.event.pull_request.user.login }}
          merged: ${{ github.event.pull_request.merged }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
