name: Screenshots

# One matrix leg per loader: capture, diff against that loader's baseline tree, report the mismatches
# on the pull request. The baseline tree is never written here; that is the chore's job after merge.
on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  loaders:
    name: Read the loaders
    # The dispatcher runs on issue and comment events too; captures belong to a pull request or a push.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Build the matrix
        id: read
        run: |
          set -euo pipefail
          # `.github/metadata.json` names this repository's loaders.
          if [[ ! -f .github/metadata.json ]]; then
            echo "::error::no .github/metadata.json; nothing names the loaders"
            exit 1
          fi
          matrix=$(jq -c '
            [.loaders[]
              | {loader: .,
                 task: ("test" + (.[0:1] | ascii_upcase) + .[1:] + "Shots")}]
          ' .github/metadata.json)
          # An empty list is not a pass: `fromJSON([])` yields a matrix with no legs, so the job would
          # go green having captured nothing at all.
          if [[ "$matrix" == "[]" ]]; then
            echo "::error::this repository lists no loaders, so no capture would run"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  captures:
    name: ${{ matrix.loader }}
    needs: loaders
    # Pinned, not `ubuntu-latest`: a baseline tree is byte-identical only within one runner image
    # (this image's Mesa/llvmpipe build). `ubuntu-latest` moving from 22.04 to newer llvmpipe made
    # every capture of every loader differ from a tree generated on 22.04, which reads as "all
    # baselines stale" rather than as a renderer change. The consumer's own CI pins the same image.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.loaders.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      # Same toolchain as the consumer's own CI: the pinned 22.04 image defaults to a Java 11 JVM,
      # which cannot even configure the build, and the client needs a display to open a window on.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Capture
        uses: kirjorjos/ci/minecraft-mods/types/screenshots/run@minecraft-mods/v1
        with:
          task: ${{ matrix.task }}
          # The gradle run directory is per-module, not at the repository root.
          captures-dir: src/${{ matrix.loader }}/mod/run/client/screenshots

      - name: Diff against baselines
        id: diff
        uses: kirjorjos/ci/minecraft-mods/types/screenshots/diff@minecraft-mods/v1
        with:
          loader: ${{ matrix.loader }}
          captures-dir: src/${{ matrix.loader }}/mod/run/client/screenshots

      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.loader }}
          path: src/${{ matrix.loader }}/mod/run/client/screenshots
          if-no-files-found: warn
          retention-days: 7

      - name: Report mismatches
        if: steps.diff.outputs.has-mismatches == 'true' && github.event_name == 'pull_request'
        uses: kirjorjos/ci/minecraft-mods/types/screenshots/comment@minecraft-mods/v1
        with:
          pr-number: ${{ github.event.pull_request.number }}
          list-file: ${{ steps.diff.outputs.list-file }}
          loader: ${{ matrix.loader }}
