name: Lifecycle

# The fan-out lives here, not in the action: a composite action cannot declare a matrix. Each leg is
# one loader's suite, and the job's own result is the single check a ruleset can require.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  loaders:
    name: Read the loaders
    # The dispatcher runs on issue and comment events too; a suite belongs to a pull request or a push.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Build the matrix
        id: read
        run: |
          set -euo pipefail
          # `.github/metadata.json` names this repository's loaders.
          if [[ ! -f .github/metadata.json ]]; then
            echo "::error::no .github/metadata.json; nothing names the loaders"
            exit 1
          fi
          matrix=$(jq -c '
            [.loaders[]
              | {loader: .,
                 task: ("test" + (.[0:1] | ascii_upcase) + .[1:] + "All")}]
          ' .github/metadata.json)
          # An empty list is not a pass: `fromJSON([])` yields a matrix with no legs, so the job would
          # go green having run no suite at all.
          if [[ "$matrix" == "[]" ]]; then
            echo "::error::this repository lists no loaders, so no suite would run"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  suites:
    name: ${{ matrix.loader }}
    needs: loaders
    # Same image as the captures job and the consumer's own CI: a `test<Loader>All` suite includes the
    # screenshot task, whose baselines are byte-identical only on the image they were generated on.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.loaders.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      # Same toolchain as the consumer's own CI: the pinned 22.04 image defaults to a Java 11 JVM,
      # which cannot even configure the build, and the client needs a display to open a window on.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run the suite
        uses: kirjorjos/ci/minecraft-mods/types/lifecycle/run@minecraft-mods/v3
        with:
          loader: ${{ matrix.loader }}
          task: ${{ matrix.task }}
          # Per-module run directory, so the leg's logs and reports are actually uploaded.
          report-dir: src/${{ matrix.loader }}/mod/run
          artifact-name: lifecycle-${{ matrix.loader }}
