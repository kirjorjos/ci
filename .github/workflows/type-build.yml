name: Build

# For a repository that has no test harness yet: compile the jars and keep them, nothing else. The
# shared matrix (`ci.yml`) is a contract about `checkModule`, `test<Loader>All` and a baseline tree,
# so a consumer that satisfies none of it would fail every job; this type asks only for `./gradlew
# build`, which every Gradle mod already has.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    # The dispatcher runs on issue and comment events too; a build belongs to a pull request or a push.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the JDKs
        id: jdk
        run: |-
          set -euo pipefail
          if [[ ! -f .github/metadata.json ]]; then
            echo "::error::no .github/metadata.json; it names the JDK this repository builds with"
            exit 1
          fi
          # setup-java makes the last version it installs the launcher JVM, so `.build.jdk` goes
          # last: it runs Gradle, while a `.build.toolchains` entry is what the project compiles
          # with. A Loom build can need both - Gradle cannot even configure on 17, while the
          # project's own toolchain is still 17 - and a consumer that declares neither gets 17.
          {
            jq -r '.build.toolchains[]?' .github/metadata.json
            jq -r '.build.jdk // 17' .github/metadata.json
          } > "$RUNNER_TEMP/jdks.txt"
          {
            echo "versions<<JDKS"
            cat "$RUNNER_TEMP/jdks.txt"
            echo "JDKS"
          } >> "$GITHUB_OUTPUT"
          echo "launcher=$(tail -1 "$RUNNER_TEMP/jdks.txt")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.jdk.outputs.launcher }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.versions }}

      - name: Build
        uses: kirjorjos/ci/minecraft-mods/types/build/run@minecraft-mods/v3
