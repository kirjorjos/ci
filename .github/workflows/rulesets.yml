name: Ruleset contexts

# A ruleset that requires a context no workflow reports looks exactly like a working gate in the API
# and blocks every pull request once it is enforced, and a ruleset nobody enforces is not a gate at
# all. Both are invisible from the pull request that would have caught them, so this runs on a
# schedule instead: it compares every consumer's required contexts against the check names its
# workflows can actually report.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rulesets
  cancel-in-progress: false

jobs:
  rulesets:
    name: Ruleset contexts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Rulesets are only visible to a token holding `administration: read`, and there is no
      # narrower way to read them: the workflow's own token cannot, so a missing grant has to say so
      # in one sentence rather than surface as a 422 from this action's stack trace.
      - name: Mint the app token
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: read

      - name: Explain a missing Administration permission
        if: steps.app.outcome == 'failure'
        run: |
          echo "::error::The app installation does not grant Administration: read, so this job cannot read any ruleset. Grant it on the app's permissions page, then accept the updated installation request; the next scheduled run picks it up. No fallback exists - the workflow token cannot read rulesets at all."
          exit 1

      - name: Compare every ruleset's required contexts against its workflows
        if: steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: ruby scripts/rulesets.rb
