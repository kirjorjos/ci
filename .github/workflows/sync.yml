name: Sync shared files

# Pushes this product's templates onto every registered consumer's default branch, and creates its
# labels. The consumers' `development` lines are never written here: their post-merge chore carries
# the same files across inside the commit it already makes.
on:
  push:
    branches:
      - main
    paths:
      - "minecraft-mods/**"
      - "consumers.jsonl"
      - "scripts/sync.sh"
      - ".github/workflows/sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync every consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Mint the app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          # The templates include a workflow file, and a tree that touches .github/workflows needs
          # this permission; without it the tree call 403s while plain blob writes still succeed.
          permission-workflows: write
          permission-issues: write

      # Which app the secrets belong to, and whether its installation can write at all. Both answers
      # are property of the configured app, not of this workflow, and are the two things that go
      # wrong when posts start failing with 403 halfway through sync.sh.
      #
      # The probe is a real write (a dangling blob, nothing is referenced) rather than
      # `.permissions.push`: an installation token reports push=false there even when it can write.
      - name: Assert the app can write to every consumer
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          INSTALLATION: ${{ steps.app.outputs.installation-id }}
        run: |
          echo "app=$APP_SLUG installation=$INSTALLATION"
          set -uo pipefail
          failed=0
          while IFS= read -r line; do
            if [[ -z "${line//[[:space:]]/}" ]]; then continue; fi
            if ! repo=$(jq -er '.repo' <<<"$line"); then continue; fi
            if ! out=$(gh api -X POST "repos/$repo/git/blobs" -f encoding=utf-8 \
              -f content="probe" --jq .sha 2>&1); then
              echo "::error::$repo: the app cannot write (contents: write is not granted to the installation): $out"
              failed=1
              continue
            fi
            echo "$repo: writable (probe blob ${out:0:7})"
          done < consumers.jsonl
          exit "$failed"

      - name: Sync
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/sync.sh
