name: Sync shared files

# Pushes this product's templates onto every registered consumer's default branch, and creates its
# labels. The consumers' `development` lines are never written here: their post-merge chore carries
# the same files across inside the commit it already makes.
on:
  push:
    branches:
      - main
    paths:
      - "minecraft-mods/**"
      - "consumers.jsonl"
      - "scripts/sync.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync every consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Mint the app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-issues: write

      # A token that cannot push makes every write inside sync.sh fail with the same 403; checking
      # here names the cause (the app installation is missing contents: write) once, up front.
      - name: Assert the token can push to every consumer
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r line; do
            if [[ -z "${line//[[:space:]]/}" ]]; then continue; fi
            if ! repo=$(jq -er '.repo' <<<"$line"); then continue; fi
            if ! perms=$(gh api "repos/$repo" --jq .permissions 2>&1); then
              echo "::error::$repo: the app token cannot read this repository: $perms"
              failed=1
              continue
            fi
            if [[ "$(jq -r '.push' <<<"$perms")" != "true" ]]; then
              echo "::error::$repo: the app token cannot push (contents: write is not granted to the installation)"
              failed=1
            fi
          done < consumers.jsonl
          exit "$failed"

      - name: Sync
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/sync.sh
