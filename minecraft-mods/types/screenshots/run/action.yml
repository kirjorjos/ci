name: Screenshot run
description: >-
  Runs one screenshot lifecycle task in a consumer repository and reports where the captures landed.
  Reads nothing of the baseline tree: pair it with `diff` or use it alone.
inputs:
  task:
    description: Gradle task that produces the captures, e.g. testFabricShots
    required: true
  captures-dir:
    description: Directory the run writes its screenshots into
    required: false
    default: run/client/screenshots
  gradle-args:
    description: Extra arguments passed to ./gradlew
    required: false
    default: --no-daemon --console=plain
outputs:
  captures-dir:
    description: Absolute path to the directory holding this run's captures
    value: ${{ steps.run.outputs.captures-dir }}
  count:
    description: Number of captures written
    value: ${{ steps.run.outputs.count }}
runs:
  using: composite
  steps:
    - name: Run the task
      id: run
      shell: bash
      env:
        TASK: ${{ inputs.task }}
        CAPTURES_DIR: ${{ inputs.captures-dir }}
        GRADLE_ARGS: ${{ inputs.gradle-args }}
      run: bash "${{ github.action_path }}/run.sh"
